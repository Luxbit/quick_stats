[package]
name = "quick_stats"
version = "1.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sysinfo = "0.31.4"
ndarray = "0.15"                                            # For CPU numerical computations
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
battery = "0.7.8"
# rustls (not default-tls): native-tls pulls in OpenSSL on linux, which
# cannot be cross-compiled for the aarch64 CI build. rustls keeps the
# whole tree OpenSSL-free and cross-compilable everywhere.
reqwest = { version = "0.12.7", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
rand = "0.8.5"
surge-ping = "0.8"
futures-util = "0.3"

# --- ML backends -------------------------------------------------------------
# macOS: libtorch (MPS device detection + MPS matmul benchmark), built against
# the exact tree LinkMesh bundles (libtorch-2.4.0-mac-cpu-arm64). tch 0.17 is
# the libtorch-2.4 binding (0.15 was the 2.2 one). `download-libtorch` lets
# bare `cargo check`/dev builds fetch libtorch when no LIBTORCH env var is
# set; publish_mac_binaries.sh always sets LIBTORCH to the LinkMesh tree.
[target.'cfg(target_os = "macos")'.dependencies]
tch = { version = "0.17", features = ["download-libtorch"] }

# Windows/Linux: ONNX Runtime instead of libtorch — the CI builds were
# CPU-only libtorch anyway (the CUDA GPU feature never worked there), and ORT
# removes the whole libtorch download/ABI/DLL ceremony.
# load-dynamic: onnxruntime is dlopen'd at RUNTIME via ORT_DYLIB_PATH (or a
# dylib sitting next to the executable) — nothing is linked or downloaded at
# build time. Use onnxruntime >= 1.23 on Linux (1.20-1.22 segfault at exit).
# Pin byte-identical with the Luxbit rust-bert/rust-sbert forks; bump in
# lockstep only.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "load-dynamic",
    "cuda",
    "directml",
] }


# Target-specific settings
[target.x86_64-unknown-linux-gnu]
# Linux AMD64 specific settings
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]

[target.aarch64-apple-darwin]
linker = "aarch64-apple-darwin-clang"
ar = "aarch64-apple-darwin-ar"

[target.x86_64-apple-darwin]
linker = "x86_64-apple-darwin-clang"
ar = "x86_64-apple-darwin-ar"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
