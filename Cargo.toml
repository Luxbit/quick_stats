[package]
name = "quick_stats"
version = "0.2.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
sysinfo = "0.31.4"
tch = "0.15.0"
ndarray = "0.15"                                            # For CPU numerical computations
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
battery = "0.7.8"
# rustls (not default-tls): native-tls pulls in OpenSSL on linux, which
# cannot be cross-compiled for the aarch64 CI build. rustls keeps the
# whole tree OpenSSL-free and cross-compilable everywhere.
reqwest = { version = "0.12.7", default-features = false, features = ["stream", "rustls-tls"] }
tokio = { version = "1.0", features = ["rt-multi-thread"] }
rand = "0.8.5"
surge-ping = "0.8"
futures-util = "0.3"


# Target-specific settings
[target.x86_64-unknown-linux-gnu]
# Linux AMD64 specific settings
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]

[target.aarch64-apple-darwin]
linker = "aarch64-apple-darwin-clang"
ar = "aarch64-apple-darwin-ar"

[target.x86_64-apple-darwin]
linker = "x86_64-apple-darwin-clang"
ar = "x86_64-apple-darwin-ar"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
