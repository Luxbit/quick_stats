# Windows x64 build + publish — on a GitHub-hosted Windows runner.
#
# Produces the one artifact the GitLab pipeline cannot (a tch binary
# cannot be cross-compiled to windows from linux: libtorch's windows
# build is MSVC C++ ABI and mingw is GNU C++ — they cannot link).
#
# The artifact is NOT uploaded to GitLab: it is attached to THIS repo's
# GitHub release v<version> (created on the fly if missing), which gives
# a public, stable, token-free download URL that LinkMesh's
# download-quick-stats.js consumes:
#
#   https://github.com/Luxbit/quick_stats/releases/download/v<version>/
#     quick_stats-<version>-win-x64.exe     <- this workflow
#
# No repository secrets are needed: the built-in GITHUB_TOKEN (with
# contents: write) creates the release and uploads the asset.
# Re-running overwrites the asset (--clobber) instead of accumulating
# duplicates. Version = Cargo.toml `version` (the same registry key the
# GitLab CI and LinkMesh's QUICK_STATS_VERSION pin use).

name: windows-x64 publish

on:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*"
      - ".github/workflows/windows-publish.yml"
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: write # create the release, upload the asset
    env:
      # MUST stay in lockstep with the libtorch LinkMesh bundles — the
      # desktop pins 2.2.2 for every platform.
      LIBTORCH_VERSION: "2.2.2"
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          if (-not $v) { Write-Error "could not read version from Cargo.toml"; exit 1 }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "publishing quick_stats $v (win-x64)"

      - name: Download libtorch (win, cpu)
        shell: pwsh
        run: |
          curl.exe -fsSL -o libtorch.zip "https://download.pytorch.org/libtorch/cpu/libtorch-win-shared-with-deps-$env:LIBTORCH_VERSION%2Bcpu.zip"
          Expand-Archive -Path libtorch.zip -DestinationPath .
          Remove-Item libtorch.zip

      - name: Build
        shell: pwsh
        run: cargo build --release
        env:
          LIBTORCH: ${{ github.workspace }}\libtorch
          LIBTORCH_BYPASS_VERSION_CHECK: "1"

      - name: Smoke — exe must start with the libtorch DLLs on PATH
        shell: pwsh
        run: |
          $env:PATH = "$(Get-Location)\libtorch\lib;$env:PATH"
          & ".\target\release\quick_stats.exe" --help
          if ($LASTEXITCODE -ne 0) { Write-Error "quick_stats.exe failed to start"; exit 1 }

      - name: Attach to the GitHub release (v<version>)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          $name = "quick_stats-$v-win-x64.exe"
          Copy-Item "target\release\quick_stats.exe" $name
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "$env:GITHUB_REPOSITORY" `
              --title "quick_stats $v" `
              --notes "Prebuilt windows binary for quick_stats $v. The linux and mac artifacts live in the quick_stats GitLab generic registry (see .gitlab-ci.yml and .dev_ops/)."
            if ($LASTEXITCODE -ne 0) { Write-Error "could not create release $tag"; exit 1 }
          }
          gh release upload $tag $name --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { Write-Error "could not upload $name to release $tag"; exit 1 }
          Write-Host "Attached $name to release $tag"
