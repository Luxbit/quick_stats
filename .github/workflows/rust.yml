# Build + test on every push/PR to master.
#
# This is the TEST gate: build-all.yml builds the shipped artifacts, this
# one runs cargo test (it is the only workflow that does). tch needs
# libtorch to build (and at test runtime), so the pinned CPU libtorch is
# set up first — MUST stay in lockstep with the libtorch LinkMesh bundles
# (the desktop pins 2.2.2 for every platform; build-all.yml uses the same
# version). The version check bypass matches build-all's jobs (tch 0.15
# hard-codes 2.2.0).

name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  LIBTORCH_VERSION: "2.2.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up libtorch (pinned CPU build)
      run: |
        curl -fsSL -o /tmp/libtorch.zip "https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-${LIBTORCH_VERSION}%2Bcpu.zip"
        unzip -q /tmp/libtorch.zip -d /opt
        rm /tmp/libtorch.zip
        echo "LIBTORCH=/opt/libtorch" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=/opt/libtorch/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        echo "LIBTORCH_BYPASS_VERSION_CHECK=1" >> "$GITHUB_ENV"
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
