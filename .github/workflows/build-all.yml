# Build the linux + windows quick_stats artifacts on GitHub-hosted
# runners and attach them to this repo's release v<version>.
#
# This repo is the build farm only. The artifacts are transferred to the
# quick_stats GitLab generic registry MANUALLY (.dev_ops/upload_registry.sh)
# — LinkMesh deliberately pulls from GitLab only, so GitHub is never on
# its critical path.
#
#   release v<pin>/  quick_stats-<pin>-linux-x64      (ubuntu-latest)
#                    quick_stats-<pin>-linux-aarch64  (ubuntu-24.04-arm, native)
#                    quick_stats-<pin>-win-x64.exe    (windows-latest, MSVC)
#
# mac-arm64 is NOT built here: it comes from
# .dev_ops/publish_mac_binaries.sh on a dev Mac, which builds against the
# exact libtorch (2.4.0) tree LinkMesh bundles and uploads straight to the
# GitLab registry.
#
# Windows/Linux run the ONNX Runtime backend:
# NO libtorch anywhere. ort is built with load-dynamic — nothing is linked or
# downloaded at build time; the onnxruntime 1.23.2 shared library is located
# at RUNTIME via ORT_DYLIB_PATH (fallback: dylib next to the executable).
# CI downloads the dylib per leg ONLY to smoke the GPU feature. onnxruntime
# >= 1.23 is required on Linux: 1.20–1.22 segfault at process exit (which is
# why every smoke below asserts the binary's exit code, not just its output).
# The win/linux graphs must contain no tch/torch-sys (graph-purity check).
#
# No cross-compilation anywhere: every job builds on its native architecture
# and smokes the binary locally before it may reach the release.
#
# Version = Cargo.toml `version` (the same registry key LinkMesh pins).
# Re-runs overwrite release assets (--clobber). No secrets: the built-in
# GITHUB_TOKEN with contents: write is enough.

name: build all platforms

env:
  # MUST stay in lockstep with the ort pin (=2.0.0-rc.13) and with the
  # onnxruntime dylib LinkMesh's desktop bundles (doc_processor parity).
  ONNXRUNTIME_VERSION: "1.23.2"

on:
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**/*"
      - "models/**/*"
      - ".github/workflows/build-all.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runs-on: ubuntu-latest
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
          - name: win-x64
            runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (linux)
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip file pkg-config libssl-dev libdbus-1-dev libudev-dev jq

      - name: Download onnxruntime (linux-x64)
        if: matrix.name == 'linux-x64'
        run: |
          curl -fsSL -o /tmp/ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          tar xzf /tmp/ort.tgz -C /opt
          rm /tmp/ort.tgz
          echo "ORT_DYLIB_PATH=/opt/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Download onnxruntime (linux-aarch64)
        if: matrix.name == 'linux-aarch64'
        run: |
          curl -fsSL -o /tmp/ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-aarch64-${ONNXRUNTIME_VERSION}.tgz"
          tar xzf /tmp/ort.tgz -C /opt
          rm /tmp/ort.tgz
          echo "ORT_DYLIB_PATH=/opt/onnxruntime-linux-aarch64-${ONNXRUNTIME_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Download onnxruntime (win-x64)
        if: matrix.name == 'win-x64'
        shell: pwsh
        run: |
          curl.exe -fsSL -o ort.zip "https://github.com/microsoft/onnxruntime/releases/download/v$env:ONNXRUNTIME_VERSION/onnxruntime-win-x64-$env:ONNXRUNTIME_VERSION.zip"
          Expand-Archive -Path ort.zip -DestinationPath .
          Remove-Item ort.zip
          $dll = Get-ChildItem -Path ".\onnxruntime-win-x64-$env:ONNXRUNTIME_VERSION" -Recurse -Filter onnxruntime.dll | Select-Object -First 1
          if (-not $dll) { Write-Error "onnxruntime.dll not found in the extracted zip"; exit 1 }
          "ORT_DYLIB_PATH=$($dll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Graph purity — no tch in the win/linux graphs
        shell: bash
        run: |
          # --prefix none flattens the tree: cargo tree indents dependency
          # lines ("├── ort v..."), so the anchored greps below only work on
          # flat output. Without it the tch check is a silent no-op and the
          # ort-presence check always fails.
          if cargo tree -e normal --prefix none | grep -Eq '^(tch|torch-sys) v'; then
            echo "FATAL: tch/torch-sys leaked into the ${{ matrix.name }} (onnx) dependency graph"
            exit 1
          fi
          cargo tree -e normal --prefix none | grep -q '^ort v' || { echo "FATAL: ort missing from the graph"; exit 1; }

      - name: Build
        run: cargo build --release

      # The binary must start WITHOUT the onnxruntime dylib (load-dynamic:
      # only session creation needs it). This is the new, softer equivalent
      # of the old "must start against its libtorch" smokes.
      - name: Smoke — dylib-free start
        shell: bash
        run: |
          unset ORT_DYLIB_PATH
          ./target/release/quick_stats --help
          ./target/release/quick_stats -e gpu --no-bandwidth --no-benchmark -f json | jq -e '.gpu'

      # With the dylib: run the ONNX GEMM benchmark on the CPU execution
      # provider (runners have no GPU). Asserts the exit code explicitly —
      # onnxruntime 1.20-1.22 segfaulted AT EXIT after printing everything.
      - name: Smoke — ONNX GEMM benchmark (CPU EP)
        shell: bash
        run: |
          echo "ORT_DYLIB_PATH=$ORT_DYLIB_PATH"
          out=$(./target/release/quick_stats --gpu-benchmark-smoke)
          echo "$out"
          echo "$out" | grep -q 'tflops=Some(' || { echo "FATAL: benchmark did not produce TFLOPS"; exit 1; }

      # GPU feature end-to-end against the machine's (empty) device list:
      # must exit 0 and emit valid JSON.
      - name: Smoke — gpu feature JSON
        shell: bash
        run: |
          ./target/release/quick_stats -e gpu --no-bandwidth --no-benchmark -f json | jq -e '.gpu' > /dev/null
          echo "gpu feature OK"

      - name: Stage artifact (registry naming convention)
        shell: bash
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$VERSION" ] || { echo "FATAL: could not read version from Cargo.toml"; exit 1; }
          mkdir -p stage
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/quick_stats.exe "stage/quick_stats-${VERSION}-win-x64.exe"
          else
            cp target/release/quick_stats "stage/quick_stats-${VERSION}-${MATRIX_NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: stage/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Read version from Cargo.toml
        id: ver
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$V" ] || { echo "FATAL: could not read version from Cargo.toml"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create release v<version> and attach all artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v$V"
          ls -la artifacts/
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>/dev/null || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "quick_stats $V" \
              --notes "Prebuilt binaries for quick_stats $V, built by GitHub on native runners for every platform. These are uploaded manually to the GitLab generic registry that LinkMesh pulls from (.dev_ops/upload_registry.sh)."
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
