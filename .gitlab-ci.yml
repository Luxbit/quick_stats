# No GitLab pipeline: ALL quick_stats binaries are built by the GitHub
# workflows (.github/workflows/build-all.yml — one job per platform on
# native GitHub runners) and attached to this repo's GitHub release
# v<version>. From there they are uploaded to THIS generic registry
# manually (.dev_ops/upload_registry.sh) — LinkMesh deliberately pulls
# from GitLab only, so GitHub is never on its critical path.
#
# This stub disables pipeline creation entirely. Do not add jobs here:
# builds belong to GitHub now.

workflow:
  rules:
    - when: never
