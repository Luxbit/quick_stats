stages:
  - build

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  DOCKER_BUILDKIT: 1

# Linux amd64 build
linux-amd64:
  stage: build
  image: rust:latest
  before_script:
    - apt-get update
    - apt-get install -y cmake curl unzip pkg-config libssl-dev libdbus-1-dev libudev-dev
    - rustup default stable
    - rustup target add x86_64-unknown-linux-gnu

    # Setup PyTorch for tch crate
    - mkdir -p /opt/libtorch
    - curl -L https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.2.0%2Bcpu.zip -o /tmp/libtorch.zip
    - unzip /tmp/libtorch.zip -d /opt
    - rm /tmp/libtorch.zip
    - export LIBTORCH=/opt/libtorch
    - export LD_LIBRARY_PATH=/opt/libtorch/lib:$LD_LIBRARY_PATH
  cache:
    key: cargo-cache
    paths:
      - .cargo
      - target/
  script:
    - mkdir -p builds
    - cargo build --release --target=x86_64-unknown-linux-gnu
    - cp target/x86_64-unknown-linux-gnu/release/quick_stats builds/quick_stats-linux-amd64
  artifacts:
    paths:
      - builds/

# Linux aarch64 build (TODO: libtorch for arm on linux needs to be build from source)
linux-aarch64:
  stage: build
  image: rust:latest
  before_script:
    - apt-get update
    - apt-get install -y cmake curl unzip pkg-config libssl-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
    # Set up multiarch for arm64
    - dpkg --add-architecture arm64
    - apt-get update
    - apt-get install -y libssl-dev:arm64
    - rustup default stable
    - rustup target add aarch64-unknown-linux-gnu
    # Configure OpenSSL for cross-compilation
    - export OPENSSL_DIR=/usr/aarch64-linux-gnu
    - export OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu
    - export OPENSSL_INCLUDE_DIR=/usr/include/aarch64-linux-gnu
    - export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
    - export PKG_CONFIG_ALLOW_CROSS=1
    # Setup PyTorch for tch crate
    - mkdir -p /opt/libtorch
    - curl -L https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.2.0%2Bcpu.zip -o /tmp/libtorch.zip
    - unzip /tmp/libtorch.zip -d /opt
    - rm /tmp/libtorch.zip
    - export LIBTORCH=/opt/libtorch
    - export LD_LIBRARY_PATH=/opt/libtorch/lib:$LD_LIBRARY_PATH
  cache:
    key: cargo-cache
    paths:
      - .cargo
      - target/
  script:
    - mkdir -p builds
    # Configure cargo with explicit settings for cross-compilation
    - mkdir -p .cargo
    - echo '[target.aarch64-unknown-linux-gnu]' > .cargo/config.toml
    - echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml
    - echo 'rustflags = ["-C", "link-arg=-L/usr/lib/aarch64-linux-gnu"]' >> .cargo/config.toml
    # Set target-specific environment variables but not global CC/CXX
    - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
    - export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
    - export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
    # Make sure we do NOT set CC and CXX globally
    - unset CC
    - unset CXX
    # Build with zstd features disabled for cross-compilation
    - RUSTFLAGS="-C target-feature=+neon" cargo build --release --target=aarch64-unknown-linux-gnu
    - cp target/aarch64-unknown-linux-gnu/release/quick_stats builds/quick_stats-linux-aarch64
  artifacts:
    paths:
      - builds/
