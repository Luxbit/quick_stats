#
# quick_stats — per-platform binaries for the LinkMesh desktop app.
#
# Publishing contract — the pinned location LinkMesh's `yarn download:deps`
# fetches (LinkMesh NEVER builds quick_stats itself; it downloads these
# prebuilt artifacts, like it does for libtorch and SurrealDB):
#
#   $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/quick_stats/<version>/
#     quick_stats-<version>-linux-x64       <- produced by this pipeline
#     quick_stats-<version>-linux-aarch64   <- on demand (see linux-aarch64)
#     quick_stats-<version>-win-x64.exe     <- MANUAL: .dev_ops/publish_windows.ps1
#     quick_stats-<version>-mac-arm64       <- MANUAL: .dev_ops/publish_mac_binaries.sh
#     quick_stats-<version>-mac-x64         <- MANUAL: .dev_ops/publish_mac_binaries.sh
#
# Why manual for mac/win: this project has no mac runner (the same
# constraint as the LinkMesh desktop mac build itself), and a `tch`-based
# binary cannot be cross-compiled to windows from linux — the LinkMesh
# doc_processor .exe artifacts are manual uploads from a Windows machine
# for exactly this reason (linkmesh: services/doc_processor/
# doc_processor.dockerfile, "only compilable on windows :S").
#
# The registry is read by LinkMesh without any token (this project is
# public and the instance serves generic-package downloads unauthenticated)
# and written here with the job token (own-project access, no allowlist).
#
# Bumping the version: change `version` in Cargo.toml (that IS the
# registry key — LinkMesh pins the same number in quickStatsVersion.ts),
# push, and let this pipeline publish.

stages:
  - build

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  # MUST stay in lockstep with the libtorch LinkMesh bundles — the desktop
  # downloader pins 2.2.2 for every platform. This binary links against
  # 2.2.2 here and runs against the desktop's bundled 2.2.2 at runtime.
  LIBTORCH_VERSION: "2.2.2"
  # tch 0.15 (torch-sys) hard-codes the expected libtorch version string
  # 2.2.0 and refuses anything else ("this tch version expects PyTorch
  # 2.2.0, got 2.2.2"). 2.2.2 is a same-series patch release with an
  # identical CPU C++ ABI, and we build against the very trees the desktop
  # bundles — so the documented bypass is safe here. Revisit if the tch
  # major version ever changes.
  LIBTORCH_BYPASS_VERSION_CHECK: "1"
  # The official prebuilt libtorch for aarch64-linux ships ONLY as the
  # PyPI manylinux wheel — download.pytorch.org has no aarch64 zips. A
  # wheel is a plain zip of the standard torch/{lib,include} tree, and
  # the aarch64 wheels of this era are CPU-only (no CUDA libs). URL
  # pinned for reproducibility; bump together with LIBTORCH_VERSION.
  TORCH_AARCH64_WHEEL_URL: "https://files.pythonhosted.org/packages/c3/7c/aeb0c5789a3f10cf909640530cd75b314959b9d9914a4996ed2c7bf8779d/torch-2.2.2-cp310-cp310-manylinux2014_aarch64.whl"

# Uploads every builds/quick_stats-* to this project's generic package
# registry under the Cargo.toml version. The job token always has access
# to its OWN project, so no allowlist or PAT is needed on the upload side.
.publish-artifacts:
  publish-script:
    - |
      set -euo pipefail
      QS_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
      [ -n "$QS_VERSION" ] || { echo "FATAL: could not read version from Cargo.toml"; exit 1; }
      shopt -s nullglob
      files=(builds/quick_stats-*)
      [ ${#files[@]} -gt 0 ] || { echo "FATAL: nothing in builds/ to publish"; exit 1; }
      for f in "${files[@]}"; do
        echo "Publishing $f -> packages/generic/quick_stats/$QS_VERSION/$(basename "$f")"
        curl -sfS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/quick_stats/$QS_VERSION/$(basename "$f")" \
          || { echo "FATAL: generic-registry upload failed for $f"; exit 1; }
      done
      echo "Published ${#files[@]} artifact(s) for quick_stats $QS_VERSION"

# Linux amd64 build — the only CI-produced artifact.
linux-amd64:
  stage: build
  image: rust:latest
  rules:
    # Republish on tags, manual triggers, and pushes that touch the recipe.
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
        - src/**/*
  before_script:
    - apt-get update
    - apt-get install -y cmake curl unzip pkg-config libssl-dev libdbus-1-dev libudev-dev
    - rustup default stable
    - rustup target add x86_64-unknown-linux-gnu
    # Setup PyTorch for the tch crate (pinned — see LIBTORCH_VERSION)
    - mkdir -p /opt/libtorch
    - curl -L https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-${LIBTORCH_VERSION}%2Bcpu.zip -o /tmp/libtorch.zip
    - unzip /tmp/libtorch.zip -d /opt
    - rm /tmp/libtorch.zip
    - export LIBTORCH=/opt/libtorch
    - export LD_LIBRARY_PATH=/opt/libtorch/lib:$LD_LIBRARY_PATH
  cache:
    key: cargo-cache
    paths:
      - .cargo
      - target/
  script:
    - |
      QS_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
      [ -n "$QS_VERSION" ] || { echo "FATAL: could not read version from Cargo.toml"; exit 1; }
    - rm -rf builds && mkdir -p builds
    - cargo build --release --target=x86_64-unknown-linux-gnu
    - cp target/x86_64-unknown-linux-gnu/release/quick_stats "builds/quick_stats-${QS_VERSION}-linux-x64"
    - !reference [.publish-artifacts, publish-script]
  artifacts:
    paths:
      - builds/

# Linux aarch64 — CROSS-BUILD on the x86_64 runners (no ARM runner
# needed), same triggers as linux-amd64: tags, web pipelines, and pushes
# that touch the build recipe.
#
# How it works, entirely inside the unprivileged job container:
#   1. Rust + the torch-sys C++ shim are CROSS-COMPILED at native speed
#      with Debian's aarch64 toolchain (g++-aarch64-linux-gnu) — no
#      emulation during the build (a fully-emulated container would be
#      10-30x slower and need binfmt/privileged setup on the host).
#   2. Linking targets the official prebuilt libtorch for aarch64-linux:
#      the PyPI manylinux wheel (download.pytorch.org has no aarch64
#      zips; a wheel is a plain zip of torch/{lib,include}, CPU-only).
#   3. The finished binary is loaded under qemu-user emulation
#      (qemu-aarch64-static — userspace only, no kernel binfmt) as a
#      fatal smoke gate: it must start, initialize libtorch and parse
#      args, or nothing is published.
# Glibc floor: linked on bookworm (2.36) — runs on Debian 12+, Ubuntu
# 24.04+ and anything newer (NOT Ubuntu 22.04).
# ABI note: the wheel is a PRE-cxx11-ABI build — hence
# LIBTORCH_CXX11_ABI=0 in the job variables (torch-sys defaults to 1,
# which fails the link on mangled-symbol mismatches). The strict
# version check never fires: the wheel has no build-version marker
# (and the global bypass is set anyway). Hosts run the artifact with
# the same wheel's libs (pip install torch==2.2.2, or the unpacked
# torch-aarch64/torch{,.libs} tree).
# The desktop packages x64 linux only (linkmesh plan, open question 3);
# this artifact is for aarch64 hosts running LinkMesh manually/server-
# side. NOTE: a `:` + space inside a plain YAML scalar parses the line
# as a mapping and fails lint — leading-quote any script line with one.
linux-aarch64:
  stage: build
  image: rust:1-bookworm
  variables:
    # The manylinux wheel is a PRE-cxx11-ABI build (unlike the +cpu zips
    # used on x64). torch-sys compiles its C++ shim with
    # -D_GLIBCXX_USE_CXX11_ABI taken from this variable and defaults it
    # to 1 — wrong here: the link would fail on mangled-symbol
    # mismatches against the ABI=0 wheel libraries.
    LIBTORCH_CXX11_ABI: "0"
  rules:
    # Republish on tags, manual triggers, and pushes that touch the
    # recipe — identical to linux-amd64 so both artifacts stay in sync.
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - Cargo.toml
        - Cargo.lock
        - .gitlab-ci.yml
        - src/**/*
  before_script:
    - apt-get update
    - apt-get install -y curl unzip file g++-aarch64-linux-gnu qemu-user-static
    - rustup default stable
    - rustup target add aarch64-unknown-linux-gnu
    # Cross toolchain for the final Rust link and the C++ shim.
    - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
    - export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
    - export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
    - export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
    # Unpack the pinned prebuilt wheel (82 MB); skipped when the cache
    # already holds it. Cache key includes the version so a bump
    # refetches.
    - |
      if [ -f torch-aarch64/torch/lib/libtorch_cpu.so ]; then
        echo "cached aarch64 libtorch ${LIBTORCH_VERSION} present - skipping wheel download"
      else
        rm -rf torch-aarch64 && mkdir -p torch-aarch64
        curl -fsSL "${TORCH_AARCH64_WHEEL_URL}" -o /tmp/torch.whl
        unzip -q /tmp/torch.whl -d torch-aarch64
        rm /tmp/torch.whl
      fi
    - export LIBTORCH="$CI_PROJECT_DIR/torch-aarch64/torch"
    # The wheel vendors libgomp & co. in torch.libs/ — put it on the
    # link search path so transitive deps of libtorch_cpu.so resolve.
    - export RUSTFLAGS="-C link-arg=-L$CI_PROJECT_DIR/torch-aarch64/torch.libs"
  cache:
    key: aarch64-${LIBTORCH_VERSION}
    paths:
      - torch-aarch64
      - .cargo
      - target/
  script:
    - |
      QS_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
      [ -n "$QS_VERSION" ] || { echo "FATAL: could not read version from Cargo.toml"; exit 1; }
    - rm -rf builds && mkdir -p builds
    - cargo build --release --target=aarch64-unknown-linux-gnu
    - |
      file target/aarch64-unknown-linux-gnu/release/quick_stats | grep -q "aarch64" || { echo "FATAL: built artifact is not an aarch64 ELF"; exit 1; }
    # Smoke gate under qemu-user: proves the loader resolves every
    # library, libtorch's static init survives, and arg parsing works.
    # FATAL on failure — a binary that cannot start is not publishable.
    - |
      export LD_LIBRARY_PATH="$CI_PROJECT_DIR/torch-aarch64/torch/lib:$CI_PROJECT_DIR/torch-aarch64/torch.libs"
      timeout 600 qemu-aarch64-static -L /usr/aarch64-linux-gnu \
        target/aarch64-unknown-linux-gnu/release/quick_stats --help \
        || { echo "FATAL: aarch64 binary failed to start under qemu-user emulation - not publishing an unverifiable artifact"; exit 1; }
    # Best-effort full device query (NOT fatal: a timeout or odd fields
    # under emulation say nothing about real aarch64 hardware).
    - |
      export LD_LIBRARY_PATH="$CI_PROJECT_DIR/torch-aarch64/torch/lib:$CI_PROJECT_DIR/torch-aarch64/torch.libs"
      if timeout 600 qemu-aarch64-static -L /usr/aarch64-linux-gnu \
          target/aarch64-unknown-linux-gnu/release/quick_stats \
          --format json --features cpu,gpu,battery,network --no-benchmark \
          > /tmp/smoke.json; then
        echo "aarch64 device query under emulation (first 400 bytes):"
        head -c 400 /tmp/smoke.json; echo
      else
        echo "WARNING: full device query did not complete under emulation - artifact verified for startup only"
      fi
    - cp target/aarch64-unknown-linux-gnu/release/quick_stats "builds/quick_stats-${QS_VERSION}-linux-aarch64"
    - !reference [.publish-artifacts, publish-script]
  artifacts:
    paths:
      - builds/
